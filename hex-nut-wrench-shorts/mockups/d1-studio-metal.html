<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>시안 1 · 스튜디오 메탈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:Pretendard,sans-serif;color:#fff;position:relative;
    background:radial-gradient(120% 70% at 50% 48%,#2a2e36 0%,#14161b 55%,#07080a 100%)}
  canvas,svg{position:absolute;left:0;top:0}
  .t{position:absolute;white-space:nowrap}
  .lab{font-size:30px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .lab small{display:block;font-size:19px;font-weight:500;letter-spacing:.14em;color:rgba(255,255,255,.6)}
  .sub{position:absolute;left:0;right:0;top:1395px;text-align:center;font-size:44px;font-weight:700;line-height:1.4;
    text-shadow:0 3px 18px rgba(0,0,0,.9)}
  .sub b{color:#ff8a2a}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<svg id="ov" width="1080" height="1920"></svg>
<canvas id="z" width="440" height="440" style="left:48px;top:930px;border-radius:50%;border:5px solid #ff8a2a;box-shadow:0 0 0 10px rgba(255,138,42,.15),0 20px 50px rgba(0,0,0,.7);background:#1a1d22"></canvas>
<div class="t" style="left:78px;top:900px;font-size:22px;font-weight:700;letter-spacing:.14em;color:#ff8a2a;background:#14161b;padding:4px 12px;border-radius:14px">ZOOM ×4</div>
<div class="t" style="left:72px;top:150px;display:flex;gap:6px">
  <span style="width:150px;height:6px;background:#ff8a2a;border-radius:3px"></span>
  <span style="width:150px;height:6px;background:#ff8a2a;border-radius:3px"></span>
  <span style="width:150px;height:6px;background:rgba(255,255,255,.25);border-radius:3px"></span>
  <span style="width:150px;height:6px;background:rgba(255,255,255,.25);border-radius:3px"></span>
</div>
<div class="t" style="left:72px;top:190px;font-size:26px;font-weight:600;letter-spacing:.12em;color:#ff8a2a">공구의 원리 · 라쳇 스패너</div>
<div class="t" style="left:70px;top:234px;font-size:70px;font-weight:800;line-height:1.22;letter-spacing:-.03em">왜 너트에서 빼지 않고<br>계속 돌릴 수 있을까?</div>
<div id="labels"></div>
<div class="sub">되돌릴 땐 멈춤쇠가 톱니를 <b>타고 넘어가요</b><br>그래서 <b>“딸깍”</b> 소리만 나고 너트는 그대로</div>

<script type="module">
import * as THREE from 'three';
import * as S from './scene3d.js';
const W = 1080, H = 1920;
const renderer = S.setupRenderer(document.getElementById('c'), { exposure: 1.05 });
const scene = new THREE.Scene(); S.envMap(renderer, scene, 0.55);

const M = {
  housing: new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 1, roughness: 0.34 }),
  gear: new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 1, roughness: 0.12 }),
  pawl: new THREE.MeshStandardMaterial({ color: 0xff7a1a, metalness: 0.55, roughness: 0.3, emissive: 0xff4d00, emissiveIntensity: 0.35 }),
  pin: new THREE.MeshStandardMaterial({ color: 0x8a8f98, metalness: 1, roughness: 0.3 }),
  spring: new THREE.MeshStandardMaterial({ color: 0x7fb6ff, metalness: 0.9, roughness: 0.25 }),
};
const steel = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 1, roughness: 0.32 });
const zinc = new THREE.MeshStandardMaterial({ color: 0xc8b98a, metalness: 1, roughness: 0.3 });
const plateM = new THREE.MeshStandardMaterial({ color: 0x3a3f47, metalness: 0.85, roughness: 0.55 });

const T = 128;
const frame = S.toolFrame(); scene.add(frame);
// bolted flange + shadow-catching floor
const flange = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.7, 0.6, 96), plateM);
flange.rotation.x = Math.PI / 2; flange.position.z = -0.14 - 0.3; flange.castShadow = flange.receiveShadow = true; frame.add(flange);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.45 }));
floor.position.z = -0.74; floor.receiveShadow = true; frame.add(floor);
frame.add(S.bolt(steel, { len: 2.9, z0: -1.2 }));
const nut = S.nut(zinc, { h: 0.82 }); nut.position.z = -0.12; frame.add(nut);
// ratchet
const R = S.ratchet(M, { T, n: 20, handleLen: 9, toothDepth: 0.34, pawlTeeth: 2 }); frame.add(R);
// motion trail: handle ghosts where the tool came from (it is swinging back, counter-clockwise)
for (const [k, op] of [[1, 0.30], [2, 0.17], [3, 0.08]]) {
  const gm = new THREE.MeshBasicMaterial({ color: 0xcfd8e6, transparent: true, opacity: op * 0.8, depthWrite: false });
  const pivot = new THREE.Group(); pivot.rotation.z = -k * 7 * Math.PI / 180;
  pivot.add(S.ghostify(R.userData.parts.handle, gm)); frame.add(pivot);
}
// arrows: amber = drive (clockwise), grey = return (counter-clockwise)
const amber = new THREE.MeshStandardMaterial({ color: 0xff8a2a, emissive: 0xff6a00, emissiveIntensity: 0.6, roughness: 0.4 });
const grey = new THREE.MeshStandardMaterial({ color: 0xe8ecf2, emissive: 0x9aa4b4, emissiveIntensity: 0.35, roughness: 0.4 });
frame.add(S.arcArrow(grey, { r: 3.05, a1: T + 95, a2: T + 30 - 0, z: 0.75, tube: 0.05, head: 0.26 }));
frame.add(S.arcArrow(amber, { r: 3.05, a1: T + 175, a2: T + 245, z: 0.75, tube: 0.05, head: 0.26 }));

// lights
const key = new THREE.DirectionalLight(0xfff1e0, 2.6); key.position.set(-6, 14, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8; key.shadow.radius = 6; key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb8ff, 2.2); rim.position.set(7, 4, -8); scene.add(rim);


const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const tgt = new THREE.Vector3(0.15, 0, 1.0), dir = new THREE.Vector3(0.3, 1, 0.7).normalize();
cam.position.copy(tgt).addScaledVector(dir, 25.5); cam.lookAt(tgt); cam.updateMatrixWorld();
renderer.render(scene, cam);

// magnifier inset on the pawl: render it first into a corner of the same GL canvas, copy it out
const zc = new THREE.PerspectiveCamera(26, 1, 0.05, 100);
const pw = S.worldOf(R, R.userData.anchors.pawl);
zc.position.copy(pw).add(new THREE.Vector3(0.55, 4.2, 1.3)); zc.lookAt(pw.clone().add(new THREE.Vector3(0.3, -0.15, 0.05))); zc.updateMatrixWorld();
renderer.setScissorTest(true); renderer.setViewport(0, 0, 440, 440); renderer.setScissor(0, 0, 440, 440);
renderer.setClearColor(0x1a1d22, 1); renderer.render(scene, zc);
document.getElementById('z').getContext('2d').drawImage(renderer.domElement, 0, H - 440, 440, 440, 0, 0, 440, 440);
renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(0x000000, 0);
renderer.render(scene, cam);
// labels
const A = R.userData.anchors, ov = document.getElementById('ov'), L = document.getElementById('labels');
const sp = v => S.toScreen(S.worldOf(R, v), cam, W, H);
const items = [
  { p: sp(A.pawl), to: [150, 640], text: '멈춤쇠', en: 'PAWL', color: '#ff8a2a', align: 'left' },
  { p: sp(A.spring), to: [150, 520], text: '스프링', en: 'SPRING', color: '#fff', align: 'left' },
  { p: sp(A.gear(T + 200)), to: [930, 560], text: '톱니바퀴', en: 'GEAR', color: '#fff', align: 'right' },
];
let svg = '';
for (const it of items) {
  svg += `<circle cx="${it.p[0]}" cy="${it.p[1]}" r="7" fill="${it.color}"/><circle cx="${it.p[0]}" cy="${it.p[1]}" r="14" fill="none" stroke="${it.color}" stroke-width="2" opacity=".6"/>`;
  svg += `<path d="M${it.p[0]} ${it.p[1]}L${it.to[0]} ${it.to[1] + 46}" stroke="${it.color}" stroke-width="2" opacity=".85"/>`;
  L.innerHTML += `<div class="t lab" style="${it.align === 'left' ? 'left' : 'right'}:${it.align === 'left' ? it.to[0] - 80 : W - it.to[0] - 0}px;top:${it.to[1]}px;color:${it.color};text-align:${it.align}">${it.text}<small>${it.en}</small></div>`;
}
const pc = sp(A.pawl);
L.innerHTML += `<div class="t" style="left:330px;top:1290px;font-size:60px;font-weight:900;color:#ff8a2a;transform:rotate(-8deg);text-shadow:0 0 24px rgba(255,120,30,.7),0 4px 10px rgba(0,0,0,.8)">딸깍!</div>`;
svg += `<path d="M${pc[0]} ${pc[1]}L330 945" stroke="#ff8a2a" stroke-width="3" stroke-dasharray="6 6"/>`;
ov.innerHTML = svg;
window.__done = true;
</script>
</body></html>
