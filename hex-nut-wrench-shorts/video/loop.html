<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>일반 스패너와 라쳇 스패너 · 8초 루프</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:720px;height:1280px;overflow:hidden}
  body{font-family:Pretendard,sans-serif;color:#fff;position:relative;background:#0c0d10}
  canvas{position:absolute;left:0;top:0}
  .panel{position:absolute;left:0;right:0;height:525px;background:radial-gradient(110% 90% at 50% 60%,#2a2e36 0%,#15171c 60%,#0a0b0e 100%)}
  #title{position:absolute;left:0;right:0;top:0;padding:58px 44px 0;font-size:54px;font-weight:900;line-height:1.14;letter-spacing:-.035em}
  #title span{color:#ff8a2a}
  .cap{position:absolute;left:0;right:0;z-index:3;padding:14px 36px 26px;background:linear-gradient(180deg,rgba(10,11,14,.82) 0%,rgba(10,11,14,.6) 70%,rgba(10,11,14,0) 100%)}
  .chip{display:inline-block;font-size:24px;font-weight:800;padding:5px 14px;border-radius:10px;margin-bottom:8px}
  .line{font-size:27px;font-weight:700;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.9)}
  .line b{color:#ff8a2a}
  .cnt{position:absolute;left:28px;z-index:3;padding:8px 18px 6px;border-radius:16px;background:rgba(10,11,14,.72);
    border:1.5px solid rgba(255,255,255,.12);line-height:1}
  .cnt small{display:block;font-size:19px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.02em}
  .cnt b{display:inline-block;font-size:54px;font-weight:900;color:#ff8a2a;transform-origin:50% 70%}
  .cnt i{font-style:normal;font-size:28px;font-weight:800;color:#fff;margin-left:3px}
  .pop{position:absolute;z-index:4;font-weight:900;color:#ff8a2a;text-shadow:0 0 18px rgba(255,120,30,.7),0 3px 8px rgba(0,0,0,.8)}
</style></head><body>
<div class="panel" style="top:215px"></div><div class="panel" style="top:752px"></div>
<canvas id="c" width="720" height="1280"></canvas>
<div id="title">일반 스패너와<br><span>라쳇 스패너</span>의 차이</div>
<div class="cap" style="top:215px"><span class="chip" style="background:#3b4250">일반 스패너</span><div class="line">돌리고, 빼고, 다시 끼우기를 <b>계속 반복</b>해야 해요</div></div>
<div class="cap" style="top:752px"><span class="chip" style="background:#ff8a2a">라쳇 스패너</span><div class="line">끼운 채 <b>왕복만!</b> 톱니가 한쪽으로만 걸려 너트가 돌아요</div></div>
<div class="cnt" style="bottom:568px"><small>조인 횟수</small><b id="cA">0</b><i>회</i></div>
<div class="cnt" style="bottom:31px"><small>조인 횟수</small><b id="cB">0</b><i>회</i></div>
<div id="pops"></div>
<script type="module">
import * as THREE from 'three';
import * as S from './scene3d.js';
import { ratchetWrenchCut } from './wrench2.js';
const W = 720, H = 1280, D = Math.PI / 180, DUR = 8;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
await document.fonts.ready;

const renderer = S.setupRenderer(document.getElementById('c'), { exposure: 1.05 });
renderer.autoClear = false;
function makeScene() {
  const sc = new THREE.Scene(); S.envMap(renderer, sc, 0.6);
  const key = new THREE.DirectionalLight(0xfff1e0, 2.6); key.position.set(-6, 14, 4); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); key.shadow.radius = 5; key.shadow.bias = -0.0005;
  sc.add(key); const rim = new THREE.DirectionalLight(0x8fb8ff, 2.0); rim.position.set(7, 4, -8); sc.add(rim);
  const f = S.toolFrame(); sc.add(f);
  const flange = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.7, 0.6, 96), new THREE.MeshStandardMaterial({ color: 0x3a3f47, metalness: 0.85, roughness: 0.55 }));
  flange.rotation.x = Math.PI / 2; flange.position.z = -0.44; flange.castShadow = flange.receiveShadow = true; f.add(flange);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.45 })); floor.position.z = -0.74; floor.receiveShadow = true; f.add(floor);
  f.add(S.bolt(new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 1, roughness: 0.32 }), { len: 2.9, z0: -1.2 }));
  return [sc, f];
}
const zinc = new THREE.MeshStandardMaterial({ color: 0xc8b98a, metalness: 1, roughness: 0.3 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xc4c9d1, metalness: 1, roughness: 0.28 });
function cam(aspect, tgt, dist, az, el) {
  const c = new THREE.PerspectiveCamera(30, aspect, 0.1, 120);
  c.position.set(tgt.x + dist * Math.cos(el) * Math.sin(az), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.cos(az));
  c.lookAt(tgt); c.updateMatrixWorld(); return c;
}
const PH = 525, PA = 215, PB = 752, ASP = W / PH;

// ---------- top: open-end spanner (period 4 s, 2 cycles) ----------
const [sA, fA] = makeScene();
const nutA = S.nut(zinc, { h: 0.82 }); nutA.position.z = -0.12; fA.add(nutA);
const hdStart = -30, hdEnd = 30;
const spPose = new THREE.Group(); spPose.add(S.spanner(chrome, { len: 7.4 })); fA.add(spPose);
const camA = cam(ASP, new THREE.Vector3(3.0, 0, -0.2), 20.5, 0.0, 54 * D);
function spanner(t) {
  const k = Math.floor(t / 4), u = t - 4 * k; let p, L, nut;
  if (u < 0.2) { p = 0; L = 0; nut = k; }
  else if (u < 1.8) { p = ease((u - 0.2) / 1.6); L = 0; nut = k + p; }
  else if (u < 2.3) { p = 1; L = ease((u - 1.8) / 0.5); nut = k + 1; }
  else if (u < 3.3) { p = 1 - ease((u - 2.3) / 1.0); L = 1; nut = k + 1; }
  else if (u < 3.8) { p = 0; L = 1 - ease((u - 3.3) / 0.5); nut = k + 1; }
  else { p = 0; L = 0; nut = k + 1; }
  return { p, L, nut };
}

// ---------- bottom: ratcheting box wrench, cover off (period 2 s, 4 cycles) ----------
const [sB, fB] = makeScene();
const nutB = S.nut(zinc, { h: 1.12 }); nutB.position.z = -0.12; fB.add(nutB);
const M = {
  black: new THREE.MeshStandardMaterial({ color: 0x24272d, metalness: 0.7, roughness: 0.34 }),
  pawl: new THREE.MeshStandardMaterial({ color: 0xff7a1a, metalness: 0.55, roughness: 0.3, emissive: 0xff4d00, emissiveIntensity: 0.35 }),
  spring: new THREE.MeshStandardMaterial({ color: 0x7fb6ff, metalness: 0.9, roughness: 0.25 }),
};
const WR = ratchetWrenchCut({ chrome, black: M.black, pawlM: M.pawl, springM: M.spring, n: 24, depth: 0.26 });
WR.position.z = 0.06; WR.userData.parts.cover.visible = false;
const pivot = new THREE.Group(); pivot.add(WR); fB.add(pivot);
const U = WR.userData, P_ = U.parts;
const camB = cam(ASP, new THREE.Vector3(2.0, 0, -0.1), 13.5, 0.0, 58 * D);
const A0 = 30, SW = 60;                     // same 60° stroke as the open-end spanner, handle swings +30° -> -30°
function ratchet(t) {                       // period 2 s: twice the strokes of the open-end spanner in the same 8 s
  const k = Math.floor(t / 2), u = t - 2 * k;
  const dk = ease((u - 0.2) / 0.75), rk = ease((u - 1.05) / 0.75);
  const h = A0 - SW * dk + SW * rk, g = -SW * (k + dk);
  return { h, g, mode: u >= 0.2 && u < 0.95 ? 'drv' : u >= 1.05 && u < 1.8 ? 'ret' : '' };
}
const CLICKS = []; { let prev = 0; for (let t = 0; t < DUR; t += 0.0005) { const s = ratchet(t), n = Math.floor((s.h - A0 - s.g) / U.s + 1e-6); if (n > prev) CLICKS.push(+t.toFixed(4)); prev = n; } }
window.CLICKS = CLICKS; window.TAPS = []; window.DURATION = DUR;

window.renderAt = t => {
  t = ((t % DUR) + DUR) % DUR;
  const a = spanner(t);
  spPose.rotation.z = -(hdStart + 60 * a.p - 195) * D; spPose.position.z = a.L * 1.05;
  nutA.rotation.z = -(hdStart - 195) * D - 60 * a.nut * D;
  const b = ratchet(t);
  pivot.rotation.z = b.h * D; P_.gear.rotation.z = (b.g - b.h) * D; nutB.rotation.z = b.g * D;
  U.setPawl(U.pawlLift(b.g - b.h));
  renderer.setClearColor(0, 0); renderer.clear(); renderer.setScissorTest(true);
  for (const [sc, c, top] of [[sA, camA, PA], [sB, camB, PB]]) {
    const y = H - top - PH; renderer.setViewport(0, y, W, PH); renderer.setScissor(0, y, W, PH); renderer.render(sc, c);
  }
  renderer.setScissorTest(false);
  let pops = '';
  const [nx, ny] = S.toScreen(S.worldOf(fB, new THREE.Vector3(0, 0, 0.9)), camB, W, PH, [0, PB, W, PH]);
  for (const c of CLICKS) { const d = (((t - c) % DUR) + DUR) % DUR; if (d > 0.4) continue;
    const sc = 0.6 + 0.5 * Math.min(1, d / 0.07), o = 1 - clamp((d - 0.22) / 0.18);
    pops += `<div class="pop" style="left:${nx + 175}px;top:${ny + 95}px;font-size:44px;opacity:${o};transform:translate(-50%,-50%) scale(${sc}) rotate(-8deg)">딸깍!</div>`; }
  document.getElementById('pops').innerHTML = pops;
  // stroke counters: +1 when a tightening stroke finishes (spanner at 1.8 s / 5.8 s, ratchet every 2 s at 0.95)
  const counter = (id, ends) => { let n = 0, last = -9; for (const e of ends) if (t >= e) { n++; last = e; }
    const el = document.getElementById(id), d = t - last, sc = d < 0.25 ? 1 + 0.35 * Math.sin(Math.PI * d / 0.25) : 1;
    el.textContent = n; el.style.transform = `scale(${sc})`; };
  counter('cA', [1.8, 5.8]); counter('cB', [0.95, 2.95, 4.95, 6.95]);
};
const q = new URLSearchParams(location.search); window.renderAt(q.has('t') ? +q.get('t') : 1.4);
window.__done = true;
</script>
</body></html>
