<!doctype html>

<style>
  *{margin:0;padding:0;box-sizing:border-box}

    text-shadow:0 3px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9)}
  #sub b{color:#ff8a2a}

</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<svg id="ov" width="1080" height="1920"></svg>
<div id="labels"></div>
<div id="zoomwrap"><canvas id="z" width="440" height="440"></canvas><div class="t" id="ztag">ZOOM ×4</div></div>
<div id="pops"></div>
<div class="t" id="prog"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as S from './scene3d.js';
import { ratchetWrenchCut } from './wrench2.js';
const W = 1080, H = 1920, D = Math.PI / 180;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, f = 0.3) => clamp(Math.min((t - a) / f, (b - t) / f));
await document.fonts.ready;

// ======================= timeline (locked to narration.wav) =======================
const DUR = 63.0;
const SC = [
  [0, 6.6, '공구의 원리 · 라쳇 스패너', '왜 너트에서 빼지 않고<br>계속 돌릴 수 있을까?'],
  [6.6, 19.3, '비교 ① 일반 스패너', '돌리고, 빼고,<br>다시 끼우고'],
  [19.3, 29.9, '비교 ② 라쳇 스패너', '속을 열어 보면'],
  [29.9, 37.6, '원리 ① 조일 때', '톱니에 <span style="color:#ff8a2a">걸린다</span>'],
  [37.6, 46.9, '원리 ② 되돌릴 때', '톱니를 <span style="color:#ff8a2a">타고 넘는다</span>'],
  [46.9, 55.8, '그래서', '끼운 채 <span style="color:#ff8a2a">왕복만</span>'],
  [55.8, DUR, '', ''],
];
const SUBS = [
  [0.25, 3.6, '렌치를 안 빼고<br>계속 돌린다?'],
  [3.75, 6.6, '비밀은 이 <b>‘딸깍’</b> 소리예요'],
  [7.0, 11.0, '일반 스패너는 좁은 곳에서<br>돌리고, 빼고,'],
  [11.0, 14.6, '다시 끼우기를<br><b>반복</b>해야 하죠'],
  [14.75, 19.0, '육각 너트라 <b>60°</b>는 돌려야<br>다시 물리거든요'],
  [20.25, 22.7, '라쳇은 <b>속이 달라요</b>'],
  [22.8, 25.15, '안에는 <b>톱니바퀴</b>와,'],
  [25.15, 27.5, '톱니에 걸리는 <b>멈춤쇠</b>,'],
  [27.5, 29.8, '그걸 밀어 주는 <b>스프링</b>이 있어요'],
  [30.2, 35.45, '조이는 방향으로 돌리면<br>멈춤쇠가 톱니에 딱 <b>걸려서</b>,'],
  [35.5, 37.5, '너트가 <b>같이</b> 돌아갑니다'],
  [37.9, 42.05, '반대로 돌리면 멈춤쇠가<br>톱니를 <b>타고 넘어가요</b>'],
  [42.15, 45.6, '그때 나는 소리가<br>바로 <b>‘딸깍’</b>'],
  [45.7, 46.9, '너트는 그대로죠'],
  [47.15, 50.95, '그래서 끼운 채<br><b>왕복만</b> 하면 됩니다'],
  [51.25, 55.6, '톱니가 72개라면<br><b>5°</b>만 움직여도 충분하죠'],
];

// ======================= renderer & shared bits =======================
const renderer = S.setupRenderer($('c'), { exposure: 1.05 });
function lights(scene, span = 9) {
  S.envMap(renderer, scene, 0.6);
  const key = new THREE.DirectionalLight(0xfff1e0, 2.6); key.position.set(-6, 14, 4); key.castShadow = true;
  key.shadow.mapSize.set(1536, 1536); Object.assign(key.shadow.camera, { left: -span, right: span, top: span, bottom: -span }); key.shadow.radius = 6; key.shadow.bias = -0.0004;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb8ff, 2.1); rim.position.set(7, 4, -8); scene.add(rim);
}
const steel = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, metalness: 1, roughness: 0.32 });
const zinc = new THREE.MeshStandardMaterial({ color: 0xc8b98a, metalness: 1, roughness: 0.3 });
const plateM = new THREE.MeshStandardMaterial({ color: 0x3a3f47, metalness: 0.85, roughness: 0.55 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xc4c9d1, metalness: 1, roughness: 0.28 });
const amberM = () => new THREE.MeshStandardMaterial({ color: 0xff8a2a, emissive: 0xff6a00, emissiveIntensity: 0.6, roughness: 0.4, transparent: true, opacity: 0 });
const greyM = () => new THREE.MeshStandardMaterial({ color: 0xe8ecf2, emissive: 0x9aa4b4, emissiveIntensity: 0.35, roughness: 0.4, transparent: true, opacity: 0 });
function base(frame) {
  const flange = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.7, 0.6, 96), plateM);
  flange.rotation.x = Math.PI / 2; flange.position.z = -0.44; flange.castShadow = flange.receiveShadow = true; frame.add(flange);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.ShadowMaterial({ opacity: 0.45 }));
  floor.position.z = -0.74; floor.receiveShadow = true; frame.add(floor);
  frame.add(S.bolt(steel, { len: 2.9, z0: -1.2 }));
}
function camOrbit(cam, tgt, dist, az, el) {
  cam.position.set(tgt.x + dist * Math.cos(el) * Math.sin(az), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.cos(az));
  cam.lookAt(tgt); cam.updateMatrixWorld();
}
const EL = Math.atan2(1, Math.hypot(0.3, 0.7)), AZ = Math.atan2(0.3, 0.7);

// ======================= scene A: open-end spanner =======================
const sA = new THREE.Scene(); lights(sA);
const fA = S.toolFrame(); sA.add(fA); base(fA);
const nutA = S.nut(zinc, { h: 0.82 }); nutA.position.z = -0.12; fA.add(nutA);
const hdStart = 62, hdEnd = 122;
const spPose = new THREE.Group(); spPose.add(S.spanner(chrome, { len: 7.4 })); fA.add(spPose);
const blockM = new THREE.MeshStandardMaterial({ color: 0x5a3a26, metalness: 0.4, roughness: 0.55 });
for (const a of [hdStart - 15, hdEnd + 15]) {
  const b = new THREE.Mesh(new RoundedBoxGeometry(1.3, 2.6, 2.2, 4, 0.12), blockM); const p = S.P(5.8, a);
  b.position.set(p.x, p.y, 0.36); b.rotation.z = -a * D; b.castShadow = b.receiveShadow = true; fA.add(b);
}
const arcA = amberM(); fA.add(S.arcArrow(arcA, { r: 3.9, a1: hdStart + 4, a2: hdEnd - 4, z: 0.75, tube: 0.06, head: 0.3 }));
const camA = new THREE.PerspectiveCamera(30, W / H, 0.1, 120);
const SP_CYC = [[7.3, 1.0], [10.6, 0.9], [13.7, 0.9]];
function spannerState(t) {
  let p = 0, L = 0, nut = 0, drive = false;
  SP_CYC.forEach(([t0, sp], k) => {
    if (t < t0) return; const u = (t - t0) / sp;
    if (u < 1.5) { p = ease(u / 1.5); L = 0; nut = k + p; drive = true; }
    else if (u < 1.9) { p = 1; L = ease((u - 1.5) / 0.4); nut = k + 1; drive = false; }
    else if (u < 2.8) { p = 1 - ease((u - 1.9) / 0.9); L = 1; nut = k + 1; drive = false; }
    else if (u < 3.2) { p = 0; L = 1 - ease((u - 2.8) / 0.4); nut = k + 1; drive = false; }
    else { p = 0; L = 0; nut = k + 1; drive = false; }
  });
  return { p, L, nut, drive };
}
const TAPS = SP_CYC.map(([t0, sp]) => t0 + 3.2 * sp);

// ======================= scene R: double box-end ratcheting wrench (cut-away) =======================
const sR = new THREE.Scene(); lights(sR, 14);
const fR = S.toolFrame(); sR.add(fR); base(fR);
const nutR = S.nut(zinc, { h: 1.12 }); nutR.position.z = -0.12; fR.add(nutR);
const M = {
  black: new THREE.MeshStandardMaterial({ color: 0x24272d, metalness: 0.7, roughness: 0.34, emissive: 0x6f9bff, emissiveIntensity: 0 }),
  pawl: new THREE.MeshStandardMaterial({ color: 0xff7a1a, metalness: 0.55, roughness: 0.3, emissive: 0xff4d00, emissiveIntensity: 0.35 }),
  spring: new THREE.MeshStandardMaterial({ color: 0x7fb6ff, metalness: 0.9, roughness: 0.25, emissive: 0x3d7dff, emissiveIntensity: 0 }),
  cover: new THREE.MeshStandardMaterial({ color: 0xc4c9d1, metalness: 1, roughness: 0.28, transparent: true, opacity: 1 }),
};
const TW = 45;                                                // handle direction (deg, clockwise from above)
const WR = ratchetWrenchCut({ chrome, coverM: M.cover, black: M.black, pawlM: M.pawl, springM: M.spring });
WR.position.z = 0.06;
const pivot = new THREE.Group(); pivot.add(WR); fR.add(pivot);
const U = WR.userData, P_ = U.parts;
const driveArrow = amberM(), returnArrow = greyM();
fR.add(S.arcArrow(driveArrow, { r: 2.95, a1: TW + 235, a2: TW + 305, z: 0.95, tube: 0.06, head: 0.3 }));
fR.add(S.arcArrow(returnArrow, { r: 2.95, a1: TW + 305, a2: TW + 235, z: 0.95, tube: 0.06, head: 0.3 }));
const camR = new THREE.PerspectiveCamera(30, W / H, 0.1, 150), camZ = new THREE.PerspectiveCamera(26, 1, 0.05, 100);

const STROKES = [
  [0.4, 1.1, 'drv', 36], [1.25, 1.85, 'ret', 36], [2.0, 2.7, 'drv', 36], [2.85, 3.45, 'ret', 36], [3.5, 4.05, 'drv', 36], [4.15, 4.75, 'ret', 36],
  [31.2, 35.0, 'drv', 36],
  [39.2, 44.6, 'ret', 36, true],
  ...[0, 1, 2, 3].map(k => [[47.4 + k * 1.4, 47.95 + k * 1.4, 'ret', 36], [48.1 + k * 1.4, 48.65 + k * 1.4, 'drv', 36]]).flat(),
];
function ratchetState(t) {
  let h = 0, g = 0, mode = '';
  for (const [t0, t1, type, A, lin] of STROKES) {
    if (t < t0) break;
    const k = t >= t1 ? 1 : (lin ? clamp((t - t0) / (t1 - t0)) : ease((t - t0) / (t1 - t0)));
    if (t < t1) mode = type;
    if (type === 'drv') { h -= A * k; g -= A * k; } else h += A * k;
  }
  return { h, g, mode };
}
const CLICKS = [];
{ let prev = 0; for (let t = 0; t <= DUR; t += 0.001) { const { h, g } = ratchetState(t); const n = Math.floor((h - g) / U.s + 1e-6); if (n > prev) CLICKS.push(+t.toFixed(3)); prev = n; } }
window.CLICKS = CLICKS; window.TAPS = TAPS; window.DURATION = DUR;

// camera keys for the ratchet scene: [t, dist, azOffset, tx, tz]
const WIDE = [47, 0.1, 2.3, 5.4], CLOSE = [24, 0.0, 0.35, 0.45];
const CK = [[0, ...WIDE], [6.6, 33, 0.06, 1.3, 3.3], [19.3, 28.5, -0.1, 0.4, 0.9], [29.9, ...CLOSE], [55.8, ...CLOSE], [60.5, ...WIDE], [DUR, 45, 0.16, 2.3, 5.2]];
function camKey(t) {
  let i = CK.findIndex(k => k[0] > t); if (i < 0) i = CK.length - 1; if (i === 0) i = 1;
  const a = CK[i - 1], b = CK[i], k = smooth((t - a[0]) / (b[0] - a[0]));
  return a.map((v, j) => lerp(v, b[j], k));
}

// ======================= per-frame =======================
$('prog').innerHTML = SC.map(() => '<i><b></b></i>').join('');
const bars = [...$('prog').querySelectorAll('b')];
const ov = $('ov'), labs = $('labels'), zctx = $('z').getContext('2d');

window.renderAt = function (t) {
  let idx = SC.findIndex(s => t >= s[0] && t < s[1]); if (idx < 0) idx = SC.length - 1; const sc = SC[idx];
  bars.forEach((b, i) => b.style.width = (i < idx ? 100 : i > idx ? 0 : 100 * clamp((t - sc[0]) / (sc[1] - sc[0]))) + '%');
  $('kick').innerHTML = sc[2]; $('title').innerHTML = sc[3];
  $('kick').style.opacity = $('title').style.opacity = idx === SC.length - 1 ? 0 : win(t, sc[0], sc[1], 0.35);
  const cue = SUBS.find(c => t >= c[0] && t < c[1]);
  $('sub').innerHTML = cue ? cue[2] : ''; $('sub').style.opacity = cue ? win(t, cue[0], cue[1], 0.2) : 0;
  $('fade').style.opacity = Math.max(clamp(1 - Math.abs(t - 6.6) / 0.28), clamp(1 - Math.abs(t - 19.3) / 0.28), clamp((t - 62.3) / 0.7));
  let svg = '', lh = '', pops = '', extra = '', card = '';
  const showZoom = t >= 30.2 && t < 55.6;
  $('zoomwrap').style.opacity = showZoom ? win(t, 30.2, 55.6, 0.4) : 0;

  if (t >= 6.6 && t < 19.3) {
    const st = spannerState(t);
    spPose.rotation.z = -(hdStart + 60 * st.p - 195) * D; spPose.position.z = st.L * 1.05;
    nutA.rotation.z = -(hdStart - 195) * D - 60 * st.nut * D;
    arcA.opacity = Math.max(st.drive ? 0.95 : 0, 0.95 * win(t, 14.75, 19.3, 0.3));
    camOrbit(camA, new THREE.Vector3(0, 0, 2.7), lerp(35, 32.5, smooth((t - 6.6) / 12.7)), lerp(0.16, -0.1, smooth((t - 6.6) / 12.7)), 56 * D);
    renderer.setClearColor(0, 0); renderer.render(sA, camA);
    const sp = v => S.toScreen(S.worldOf(fA, v), camA, W, H);
    if (t > 14.75) {
      const m = sp(new THREE.Vector3(...S.P(4.6, 92).toArray(), 0.75)); const o = win(t, 14.85, 19.3, 0.3);
      lh += `<div class="t" style="left:${m[0]}px;top:${m[1]}px;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#ff8a2a;opacity:${o};text-shadow:0 4px 14px rgba(0,0,0,.9)">60°</div>`;
      extra += `<div class="t chip" style="right:60px;top:1290px;opacity:${win(t, 16.2, 19.2, 0.3)}">헤드를 뒤집어 끼우면 30°마다</div>`;
    }
    const act = st.drive ? 0 : st.L > 0.02 && st.p > 0.98 ? 1 : st.L > 0.02 ? 2 : -1;
    extra += `<div class="t" style="left:72px;top:420px;display:flex;gap:12px;opacity:${win(t, 7.0, 19.0, 0.3)}">` +
      ['① 돌리고', '② 빼고', '③ 다시 끼우고'].map((x, i) => `<span style="font-size:32px;font-weight:800;padding:8px 18px;border-radius:12px;${i === act ? 'background:#ff8a2a;color:#fff' : 'background:rgba(255,255,255,.08);color:rgba(255,255,255,.45)'}">${x}</span>`).join('') + '</div>';
  } else {
    const st = ratchetState(t), rel = st.h - st.g;
    pivot.rotation.z = (-TW + st.h) * D;
    P_.gear.rotation.z = (st.g - st.h) * D;
    nutR.rotation.z = (st.g - TW) * D;
    let u = ((rel / U.s) % 1 + 1) % 1; if (u > 0.9995) u = 0;
    const lift = U.depth * 1.06 * u;
    P_.pawlPivot.rotation.z = U.pawlSign * Math.asin(clamp(lift / U.arm, -1, 1));
    P_.springGroup.scale.x = (U.springLen - lift * U.springArm / U.arm) / U.springLen;
    // cover: lifts off in the parts intro, settles back for the outro
    const cv = smooth((t - 20.3) / 1.7) * (1 - smooth((t - 56.0) / 1.5));
    P_.cover.position.z = U.H - 0.1 + cv * 3.4; M.cover.opacity = 1 - cv; P_.cover.visible = cv < 0.999;
    M.black.emissiveIntensity = 0.3 * win(t, 22.8, 25.0, 0.3);
    M.pawl.emissiveIntensity = 0.35 + 0.6 * win(t, 25.2, 27.4, 0.3) + (st.mode === 'drv' && t > 30 && t < 37.6 ? 0.5 : 0);
    M.spring.emissiveIntensity = 0.7 * win(t, 27.5, 29.8, 0.3);
    driveArrow.opacity = 0.95 * win(t, 30.4, 37.3, 0.4); returnArrow.opacity = 0.95 * win(t, 38.0, 46.6, 0.4);
    const ck = camKey(t);
    camOrbit(camR, new THREE.Vector3(ck[3], 0, ck[4]), ck[1], AZ + ck[2], EL);
    if (showZoom) {
      const pw = S.worldOf(WR, U.anchors.pawl), q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), (-TW + st.h) * D);
      camZ.position.copy(pw).add(new THREE.Vector3(-0.6, 4.4, 1.2).applyQuaternion(q));
      camZ.lookAt(pw.clone().add(new THREE.Vector3(-0.3, -0.15, 0).applyQuaternion(q))); camZ.updateMatrixWorld();
      renderer.setScissorTest(true); renderer.setViewport(0, 0, 440, 440); renderer.setScissor(0, 0, 440, 440);
      renderer.setClearColor(0x1a1d22, 1); renderer.render(sR, camZ);
      zctx.drawImage(renderer.domElement, 0, H - 440, 440, 440, 0, 0, 440, 440);
      renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
    }
    renderer.setClearColor(0, 0); renderer.render(sR, camR);
    const sp = v => S.toScreen(S.worldOf(WR, v), camR, W, H);
    // part labels: [tIn, anchor, dx, dy, text, en, colour]
    const items = [
      [22.8, sp(U.anchors.gear(135)), -120, -170, '톱니바퀴', 'GEAR', '#fff'],
      [25.15, sp(U.anchors.pawl), -330, 60, '멈춤쇠', 'PAWL', '#ff8a2a'],
      [27.5, sp(U.anchors.spring), 230, 70, '스프링', 'SPRING', '#9cc6ff'],
    ];
    for (const [tin, p, dx, dy, txt, en, col] of items) {
      const o = clamp((t - tin) / 0.4) * clamp((47 - t) / 0.4); if (o <= 0) continue;
      const x = p[0] + dx, y = p[1] + dy;
      svg += `<g opacity="${o}"><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${col}"/><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="none" stroke="${col}" stroke-width="2" opacity=".6"/><path d="M${p[0]} ${p[1]}L${x} ${y}" stroke="${col}" stroke-width="2.5" opacity=".9"/></g>`;
      lh += `<div class="t lab" style="opacity:${o};left:${x}px;top:${y}px;transform:translate(${dx < 0 ? '-100%' : '0'},-50%);padding:0 12px;color:${col};text-align:${dx < 0 ? 'right' : 'left'}">${txt}<small>${en}</small></div>`;
    }
    if (t > 23.2 && t < 29.8) extra += `<div class="t chip" style="left:50%;transform:translateX(-50%);top:1270px;opacity:${win(t, 23.2, 29.8, 0.35)}">12각 구멍 = 육각 두 개를 겹친 모양 · <span style="color:#ff8a2a">30°마다</span> 끼움</div>`;
    for (const c of CLICKS) {
      const a = t - c; if (a < 0 || a > 0.45) continue;
      const s2 = 0.6 + 0.5 * Math.min(1, a / 0.08), o = 1 - smooth((a - 0.25) / 0.2);
      const [nx, ny] = sp(new THREE.Vector3(0, 0, 0.7)), x = showZoom ? 300 : nx + 250, y = showZoom ? 1310 : ny + 20;
      pops += `<div class="pop" style="left:${x}px;top:${y}px;font-size:${showZoom ? 60 : 70}px;opacity:${o};transform:translate(-50%,-50%) scale(${s2}) rotate(-8deg)">딸깍!</div>`;
    }
    if (st.mode === 'drv' && t > 30 && t < 37.6) pops += `<div class="pop" style="left:330px;top:1310px;font-size:60px;transform:translate(-50%,-50%) rotate(-8deg)">걸림!</div>`;
    if (t >= 46.9 && t < 55.8) {
      const turned = Math.round(-(st.g - ratchetState(46.9).g));
      extra += `<div class="t chip" style="right:60px;top:1010px;opacity:${win(t, 47.2, 55.8, 0.3)}">너트 회전 <span style="color:#ff8a2a">${turned}°</span></div>`;
      extra += `<div class="t chip" style="right:60px;top:1100px;opacity:${win(t, 51.3, 55.8, 0.3)}">일반 60° → 라쳇 <span style="color:#ff8a2a">5°</span></div>`;
    }
    if (t >= 55.8) {
      const o1 = clamp((t - 56.1) / 0.5), o2 = clamp((t - 59.25) / 0.5), o3 = clamp((t - 60.4) / 0.5);
      card = `<div style="position:absolute;left:0;right:0;top:-330px;height:1150px;background:radial-gradient(70% 45% at 50% 52%,rgba(7,8,10,.8),rgba(7,8,10,0));opacity:${o1}"></div>
        <div style="position:relative">
        <div style="opacity:${o1};transform:translateY(${(1 - o1) * 30}px)"><div style="font-size:30px;font-weight:600;letter-spacing:.14em;color:#ff8a2a">정리</div>
        <div style="font-size:84px;font-weight:800;line-height:1.2;letter-spacing:-.03em;text-shadow:0 4px 24px rgba(0,0,0,.9)">한쪽으로만<br>걸리는 톱니</div></div>
        <div style="font-size:48px;font-weight:700;margin-top:14px;text-shadow:0 3px 14px #000;opacity:${o2};transform:translateY(${(1 - o2) * 20}px)">= 라쳇의 원리</div>
        <div style="margin-top:34px;opacity:${o3}"><span class="chip">풀 때는 렌치를 뒤집거나 방향 레버 전환</span></div></div>`;
    }
  }
  ov.innerHTML = svg; labs.innerHTML = lh; $('pops').innerHTML = pops; $('extra').innerHTML = extra; $('card').innerHTML = card;
};
const q = new URLSearchParams(location.search);
window.renderAt(q.has('t') ? +q.get('t') : 0);
window.__done = true;
</script>
